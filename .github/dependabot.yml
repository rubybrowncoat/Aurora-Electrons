# Dependabot can't open security-update PRs for bun projects, only version updates. Run `bun audit` before a release to catch advisories between these PRs.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Vue 3 and Vuetify 3+ mean migrating the whole app: Vuetify 2, vuex 3 and @vitejs/plugin-vue2 all require Vue 2.
      - dependency-name: "vue"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vuetify"
        update-types: ["version-update:semver-major"]
      # Only lint uses TypeScript, through @typescript-eslint, which needs its compiler API. TypeScript 7 no longer exports it, and lint crashes before reading a file.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
