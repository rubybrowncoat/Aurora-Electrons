# Dependabot can't open security-update PRs for bun projects, only version updates.
# Run `bun audit` before a release to catch advisories between these PRs.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
